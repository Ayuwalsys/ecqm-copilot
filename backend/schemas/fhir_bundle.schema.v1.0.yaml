schema_version: "1.0"
description: >
  Structural contract for FHIR Bundles accepted by the eCQM Copilot ingest
  pipeline. This file is content-locked via SHA-256
  (see fhir_bundle.schema.v1.0.yaml.sha256, generated by backend/schemas/lock.py).
  Any change to the fields below requires bumping schema_version, creating a
  new fhir_bundle.schema.vX.Y.yaml file, and regenerating its lock hash —
  never edit a locked version in place.

bundle:
  resourceType: Bundle
  type: collection
  min_entries: 1

# Structural requirements per FHIR resourceType. `required: true` means the
# bundle must contain at least one resource of this type. `fields` are
# dotted-path checks against each resource of that type (e.g. "code.coding"
# means resource["code"]["coding"]).
resources:
  Patient:
    required: true
    max_occurs: 1
    fields:
      id: { required: true, type: string }
      birthDate: { required: true, type: date }
      gender: { required: false, type: string }

  Encounter:
    required: true
    fields:
      id: { required: true, type: string }
      status: { required: true, type: string }
      period.start: { required: true, type: datetime }
      period.end: { required: false, type: datetime }

  Condition:
    required: false
    fields:
      id: { required: true, type: string }
      code.coding: { required: true, type: list }
      clinicalStatus.coding: { required: false, type: list }
      onsetDateTime: { required: false, type: datetime }

  Observation:
    required: false
    fields:
      id: { required: true, type: string }
      status: { required: true, type: string }
      code.coding: { required: true, type: list }
      valueQuantity.value: { required: false, type: number }
      effectiveDateTime: { required: false, type: datetime }

  Procedure:
    required: false
    fields:
      id: { required: true, type: string }
      status: { required: true, type: string }
      code.coding: { required: true, type: list }
      performedDateTime: { required: false, type: datetime }

  MedicationRequest:
    required: false
    fields:
      id: { required: true, type: string }
      medicationCodeableConcept.coding: { required: false, type: list }
      status: { required: false, type: string }
      authoredOn: { required: false, type: date }

  DocumentReference:
    required: true
    fields:
      id: { required: true, type: string }
      status: { required: false, type: string }
      content: { required: true, type: list }

# Per-measure structural requirements. Value sets themselves (ICD-10/LOINC/CPT
# codes) are NOT duplicated here — they remain single-sourced in
# backend/measures/{measure_id}.yaml. This section only says which resource
# types a bundle must carry to be usable for a given measure, plus where in
# the bundle each measure's value sets should be checked.
measures:
  diabetes_hba1c:
    required_resource_types: [Patient, Encounter, Condition, DocumentReference]
    value_set_checks:
      - resource: Condition
        path: code.coding.code
        measure_value_set: value_sets.diabetes
        match: prefix
      - resource: Observation
        path: code.coding.code
        measure_value_set: value_sets.hba1c_loinc
        match: exact
        note: "May be absent — absence itself is a numerator condition per rules.py"

  ami_8a:
    required_resource_types: [Patient, Encounter, Condition, Procedure, DocumentReference]
    value_set_checks:
      - resource: Condition
        path: code.coding.code
        measure_value_set: value_sets.ami_icd10
        match: prefix
      - resource: Procedure
        path: code.coding.code
        measure_value_set: value_sets.pci_cpt
        match: exact
