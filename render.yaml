services:
  # FastAPI backend
  - type: web
    name: ecqm-copilot-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: huggingface
      - key: HF_API_TOKEN
        sync: false          # set in Render dashboard
      - key: HF_MODEL
        value: mistralai/Mistral-7B-Instruct-v0.3

  # Streamlit frontend
  - type: web
    name: ecqm-copilot-ui
    env: python
    rootDir: frontend
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: BACKEND_URL
        fromService:
          name: ecqm-copilot-api
          type: web
          property: host
